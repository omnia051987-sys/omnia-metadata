services:
  - type: web
    name: omnia-metadata-auth-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: omnia051987@gmail.com
      - key: SMTP_FROM
        value: omnia051987@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: OMNIA_AUTH_BASE_URL
        value: https://omnia-metadata-auth-api.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: OMNIA_D1_STORE_URL
        value: https://omnia-metadata-auth.leohighway.workers.dev
      - key: OMNIA_D1_STORE_SECRET
        sync: false
