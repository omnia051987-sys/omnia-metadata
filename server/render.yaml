services:
  - type: web
    name: omnia-metadata-auth-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: omnia051987@gmail.com
      - key: SMTP_FROM
        value: omnia051987@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: OMNIA_AUTH_BASE_URL
        value: https://auth.omniametadata.com
